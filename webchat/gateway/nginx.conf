worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # The browser sees one origin. Routing is by path because the public contract is one API.
    upstream identity { server identity:8000; }
    upstream social { server social:8000; }
    upstream chat { server chat:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 26m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # WebSocket first: a prefix match would also be caught by the conversations rule.
        location = /ws/v1/chat {
            proxy_pass http://chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Chat owns everything below a conversation.
        location ~ ^/api/v1/conversations/[^/]+/(messages|attachments|read-state|unread-summary)(/|$) {
            proxy_pass http://chat;
        }

        # Identity owns accounts and tokens.
        location ~ ^/api/v1/(auth|users)(/|$) {
            proxy_pass http://identity;
        }

        # Social owns friendships and the conversation itself.
        location ~ ^/api/v1/(friend-requests|friends)(/|$) {
            proxy_pass http://social;
        }
        location ~ ^/api/v1/conversations(/|$) {
            proxy_pass http://social;
        }

        # Internal endpoints are never exposed to the browser.
        location /internal/ {
            default_type application/json;
            return 404 '{"error":{"code":"CONVERSATION_NOT_FOUND","message":"Not found."}}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Not found."}}';
        }
    }
}
